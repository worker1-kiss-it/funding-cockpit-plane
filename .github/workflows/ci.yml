name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-lint-test:
    name: API — ruff + funding tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install ruff pytest pytest-django
      - name: Ruff
        working-directory: apps/api
        run: ruff check plane/funding
      - name: Funding tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://plane:plane@localhost:5432/plane
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret
          DJANGO_SETTINGS_MODULE: plane.settings.test
        run: pytest plane/funding -q

  web-lint-typecheck:
    name: Web — lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plane/web lint
      - run: pnpm --filter @plane/web typecheck
